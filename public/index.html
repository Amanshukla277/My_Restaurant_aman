<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Billing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand" id="brand">Restaurant Billing</div>
    <nav id="nav">
      <button data-view="billing" class="active">Billing</button>
      <button data-view="menu">Menu</button>
      <button data-view="bills">Bills</button>
      <button data-view="reports">Reports</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>

  <main>
    <!-- Billing screen: tables | menu | current order -->
    <section id="view-billing" class="view pos">
      <aside class="pane tables-pane">
        <h3>Tables</h3>
        <div id="tables" class="tables"></div>
        <h3>Takeaway</h3>
        <button class="btn primary block" data-action="newTakeaway">+ New takeaway order</button>
        <div id="takeaways" class="takeaways"></div>
      </aside>

      <section class="pane menu-pane">
        <div class="menu-tools">
          <input id="search" type="search" placeholder="Search menu (Enter adds the first match)" autocomplete="off">
          <div id="categories" class="chips"></div>
        </div>
        <div id="dishes" class="menu-grid"></div>
      </section>

      <aside class="pane order-pane" id="order-pane"></aside>
    </section>

    <section id="view-menu" class="view hidden"></section>
    <section id="view-bills" class="view hidden"></section>
    <section id="view-reports" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <div id="toasts" class="no-print"></div>
  <div id="modal-root"></div>

  <script src="js/common.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/bills.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
